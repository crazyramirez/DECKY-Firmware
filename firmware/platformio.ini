; DECKY — firmware for every supported deck, from one source tree.
;
;   src/core/            shared by every deck: app logic, network, storage, crypto, alerts, i18n…
;   src/decks/<DECK>/    one folder per deck: board drivers, lv_conf.h / board_pins.h (include/),
;                        the screens laid out for its panel, fonts and embedded images
;
; Every deck builds core + its own folder (build_src_filter); both are on the include path
; (build_src_flags), so "app/app_controller.h" resolves to whichever of the two holds it. A path
; lives in exactly one of them.
;
; Versions are pinned on purpose (see docs/adr/0001-firmware-stack.md):
;   platform  pioarduino 55.03.35  -> Arduino-ESP32 3.3.5 on ESP-IDF 5.5.1
;   LVGL      8.4.0
;
; Environments (the release builds the four product ones):
;   JC1060P470C       Guition JC1060P470C, 7" 1024x600, ESP32-P4 silicon v1.x (+ ESP32-C6 Wi-Fi)
;   JC1060P470C_r3    the same for ESP32-P4 silicon v3.x
;   JC4827W543        Guition JC4827W543, 4.3" 480x272, ESP32-S3
;   JC3248W535        Guition JC3248W535, 3.5" 320x480 portrait, ESP32-S3
;   hwtest_<DECK>     hardware bring-up (display colours, touch, backlight, Wi-Fi scan, heap logs)
;   test              on-target unit tests of pure logic (alerts, history, protocol): pio test -e test
;
; Adding a deck: src/decks/<DECK>/ (see docs/ARCHITECTURE.md), a [deck_<DECK>] section and its
; environments below, the simulator's main.cpp in sim/decks/<DECK>/ and a line in the CI matrix.

[platformio]
default_envs = JC1060P470C, JC4827W543, JC3248W535

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags =
    -std=gnu++17
    -Wall
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    lvgl/lvgl@8.4.0

; Libraries of the product UI (on top of LVGL).
[product]
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@7.4.3
    links2004/WebSockets@2.7.3
    bitbank2/JPEGDEC@1.8.4

; ---- Guition JC1060P470C: ESP32-P4 + ESP32-C6 Wi-Fi over ESP-Hosted/SDIO, 7" 1024x600 IPS, JD9165
; MIPI-DSI, GT911 touch. Flash 16 MB: two 7 MB app slots (OTA-ready layout), NVS, a coredump area.
; Console: the board's USB-C is the P4's USB-Serial/JTAG (a COM port). Arduino's HWCDC Serial is off
; (ARDUINO_USB_CDC_ON_BOOT=0: its TX interrupt faults on the P4 under load); logs go through the
; ESP-IDF console (USE_ESP_IDF_LOG) and board/usb_console reads commands.
[deck_JC1060P470C]
board = esp32-p4-evboard
board_build.partitions = partitions/JC1060P470C.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
upload_speed = 1500000
monitor_dtr = 0
monitor_rts = 0
build_flags =
    ${env.build_flags}
    -I src/decks/JC1060P470C/include
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DUSE_ESP_IDF_LOG
    -DLOG_LOCAL_LEVEL=ESP_LOG_INFO
    -Wno-missing-field-initializers
build_src_flags = -I src/core -I src/decks/JC1060P470C

[env:JC1060P470C]
extends = deck_JC1060P470C
build_flags = ${deck_JC1060P470C.build_flags} -DPCD_APP_DECK=1
build_src_filter = +<core/> -<core/hwtest/> +<decks/JC1060P470C/> -<decks/JC1060P470C/hwtest/>
lib_deps = ${product.lib_deps}

[env:JC1060P470C_r3]
extends = env:JC1060P470C
board = esp32-p4_r3

[env:hwtest_JC1060P470C]
extends = deck_JC1060P470C
build_flags = ${deck_JC1060P470C.build_flags} -DPCD_APP_HWTEST=1
build_src_filter = +<core/main.cpp> +<decks/JC1060P470C/board/> +<decks/JC1060P470C/hwtest/>

; ---- Guition JC4827W543: ESP32-S3 (WROOM-1 N4R8), 4.3" 480x272 NV3041A QSPI, GT911 touch (C
; variant). Flash 4 MB: huge_app.csv = one 3 MB app slot, no OTA (same layout as the vendor firmware).
[deck_JC4827W543]
board = jc4827w543
board_build.partitions = huge_app.csv
upload_speed = 921600
; GPIO0 (BOOT strap) is shared with the panel's TE output, which sits low once the panel has been
; initialised: a hard reset through RTS then lands in the ROM download mode. A watchdog reset does
; not re-sample the straps, so the new firmware actually starts after an upload.
board_upload.after_reset = watchdog-reset
build_flags =
    ${env.build_flags}
    -I src/decks/JC4827W543/include
build_src_flags = -I src/core -I src/decks/JC4827W543

[env:JC4827W543]
extends = deck_JC4827W543
build_flags = ${deck_JC4827W543.build_flags} -DPCD_APP_DECK=1
build_src_filter = +<core/> -<core/hwtest/> +<decks/JC4827W543/> -<decks/JC4827W543/hwtest/>
lib_deps = ${product.lib_deps}

[env:hwtest_JC4827W543]
extends = deck_JC4827W543
build_flags = ${deck_JC4827W543.build_flags} -DPCD_APP_HWTEST=1
build_src_filter = +<core/main.cpp> +<decks/JC4827W543/board/> +<decks/JC4827W543/hwtest/>

; ---- Guition JC3248W535 / JC3248W535EN: ESP32-S3 (N16R8), 3.5" 320x480 AXS15231B QSPI with its
; own touch core, portrait. Flash 16 MB (default_16MB.csv).
[deck_JC3248W535]
board = jc3248w535
board_build.partitions = default_16MB.csv
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -I src/decks/JC3248W535/include
build_src_flags = -I src/core -I src/decks/JC3248W535

[env:JC3248W535]
extends = deck_JC3248W535
build_flags = ${deck_JC3248W535.build_flags} -DPCD_APP_DECK=1
build_src_filter = +<core/> -<core/hwtest/> +<decks/JC3248W535/> -<decks/JC3248W535/hwtest/>
lib_deps = ${product.lib_deps}

[env:hwtest_JC3248W535]
extends = deck_JC3248W535
build_flags = ${deck_JC3248W535.build_flags} -DPCD_APP_HWTEST=1
build_src_filter = +<core/main.cpp> +<decks/JC3248W535/board/> +<decks/JC3248W535/hwtest/>

; On-target unit tests of pure logic (alerts, history, protocol) on any ESP32-S3 deck:
;   pio test -e test --upload-port COMx
[env:test]
extends = deck_JC3248W535
build_flags = ${deck_JC3248W535.build_flags} -DPCD_APP_TEST=1 -I src/core
build_src_filter = +<core/alerts/> +<core/telemetry/> +<core/network/protocol_parser.cpp>
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson@7.4.3
test_speed = 115200
